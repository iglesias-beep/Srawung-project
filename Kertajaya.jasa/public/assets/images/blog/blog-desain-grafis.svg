<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- decorative dots grid -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="80" cy="80" r="4"/><circle cx="120" cy="80" r="4"/><circle cx="160" cy="80" r="4"/>
    <circle cx="80" cy="120" r="4"/><circle cx="120" cy="120" r="4"/><circle cx="160" cy="120" r="4"/>
    <circle cx="80" cy="160" r="4"/><circle cx="120" cy="160" r="4"/><circle cx="160" cy="160" r="4"/>
    <circle cx="1120" cy="560" r="4"/><circle cx="1160" cy="560" r="4"/><circle cx="1200" cy="560" r="4"/>
    <circle cx="1120" cy="600" r="4"/><circle cx="1160" cy="600" r="4"/><circle cx="1200" cy="600" r="4"/>
    <circle cx="1120" cy="640" r="4"/><circle cx="1160" cy="640" r="4"/><circle cx="1200" cy="640" r="4"/>
  </g>

  <!-- big soft circles -->
  <circle cx="1080" cy="140" r="180" fill="#a78bfa" opacity="0.18"/>
  <circle cx="200" cy="600" r="150" fill="#f472b6" opacity="0.15"/>

  <!-- illustration card -->
  <rect x="700" y="170" width="420" height="380" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- artboard inside card -->
  <rect x="740" y="210" width="260" height="200" rx="12" fill="#ffffff" opacity="0.92"/>
  <circle cx="800" cy="270" r="26" fill="#f472b6"/>
  <rect x="840" y="250" width="130" height="12" rx="6" fill="#4c1d95" opacity="0.75"/>
  <rect x="840" y="274" width="100" height="10" rx="5" fill="#4c1d95" opacity="0.45"/>
  <rect x="762" y="320" width="208" height="10" rx="5" fill="#4c1d95" opacity="0.35"/>
  <rect x="762" y="342" width="176" height="10" rx="5" fill="#4c1d95" opacity="0.25"/>

  <!-- pen tool path -->
  <path d="M 750 480 Q 850 400 940 470 T 1090 430" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <rect x="738" y="468" width="24" height="24" fill="#ffffff" transform="rotate(45 750 480)"/>
  <rect x="1078" y="418" width="24" height="24" fill="#ffffff" transform="rotate(45 1090 430)"/>

  <!-- color swatches -->
  <g>
    <rect x="1020" y="220" width="56" height="56" rx="12" fill="#f43f5e"/>
    <rect x="1020" y="284" width="56" height="56" rx="12" fill="#fb923c"/>
    <rect x="1020" y="348" width="56" height="56" rx="12" fill="#22d3ee"/>
  </g>

  <!-- cursor -->
  <path d="M 900 300 l 0 90 l 24 -22 l 16 36 l 20 -10 l -16 -34 l 32 -4 z" fill="#ffffff" stroke="#1e1b4b" stroke-width="4" stroke-linejoin="round"/>

  <!-- text -->
  <text x="90" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Jasa Desain</text>
  <text x="90" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#accent)">Grafis Profesional</text>
  <text x="90" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#ffffff" opacity="0.85">Logo, branding &amp; materi promosi untuk usahamu</text>

  <!-- badge -->
  <rect x="90" y="520" width="360" height="56" rx="28" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.3"/>
  <text x="118" y="556" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#ffffff">🎨 Rekomendasi Usaha Teman</text>
</svg>
