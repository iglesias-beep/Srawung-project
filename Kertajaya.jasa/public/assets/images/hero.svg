<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520" fill="none" role="img" aria-label="Ilustrasi toko bahan bangunan Kertajaya">
  <defs>
    <!-- Gradients -->
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e3a5f"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8590c"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="g3" x1=".5" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="g6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#059669"/></linearGradient>

    <!-- Isometric shadow -->
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity=".25"/></filter>
    <filter id="ds2"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".2"/></filter>
    <filter id="gl"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

    <style>
      @keyframes floatUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes floatDown{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
      @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
      @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      .f1{animation:floatUp 4s ease-in-out infinite}
      .f2{animation:floatDown 3.5s ease-in-out infinite}
      .f3{animation:floatUp 5s ease-in-out infinite .5s}
      .pl{animation:pulse 3s ease-in-out infinite}
    </style>
  </defs>

  <!-- BG -->
  <rect width="800" height="520" fill="url(#g1)"/>

  <!-- Grid pattern -->
  <g opacity=".04" stroke="#fff" stroke-width=".5">
    <line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="520"/><line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/><line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520"/><line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="700" y1="0" x2="700" y2="520"/>
  </g>

  <!-- Decorative circles bg -->
  <circle cx="120" cy="100" r="180" fill="#e8590c" opacity=".03"/>
  <circle cx="680" cy="420" r="200" fill="#fbbf24" opacity=".03"/>
  <circle cx="650" cy="80" r="100" fill="#22d3ee" opacity=".04"/>

  <!-- ====== MAIN ISOMETRIC BUILDING ====== -->
  <g filter="url(#ds)" transform="translate(200,60)">
    <!-- Floor shadow -->
    <ellipse cx="200" cy="390" rx="220" ry="30" fill="#0f172a" opacity=".3"/>

    <!-- Building base - isometric box -->
    <!-- Left face -->
    <polygon points="40,200 200,280 200,390 40,310" fill="#1e293b"/>
    <!-- Right face -->
    <polygon points="200,280 380,200 380,310 200,390" fill="#253347"/>
    <!-- Top face -->
    <polygon points="40,200 200,120 380,200 200,280" fill="#334155"/>

    <!-- Roof accent stripe -->
    <polygon points="40,200 200,120 380,200 200,280" fill="none" stroke="url(#g2)" stroke-width="3"/>

    <!-- Sign board on front -->
    <g class="pl">
      <polygon points="110,215 200,255 290,215 200,175" fill="#1e293b" stroke="#e8590c" stroke-width="2"/>
      <text x="200" y="222" font-family="Segoe UI,system-ui,sans-serif" font-size="16" font-weight="800" fill="#fbbf24" text-anchor="middle" letter-spacing="3">KERTAJAYA</text>
    </g>

    <!-- Door left face -->
    <polygon points="150,260 200,285 200,370 150,345" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <polygon points="200,285 250,260 250,345 200,370" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Door handle -->
    <circle cx="190" cy="320" r="3" fill="#fbbf24"/>

    <!-- Windows left face -->
    <polygon points="55,230 90,248 90,278 55,260" fill="#0ea5e9" opacity=".4"/>
    <polygon points="55,230 90,248 90,278 55,260" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="100,252 135,270 135,300 100,282" fill="#0ea5e9" opacity=".3"/>
    <polygon points="100,252 135,270 135,300 100,282" fill="none" stroke="#38bdf8" stroke-width="1"/>

    <!-- Windows right face -->
    <polygon points="320,230 285,248 285,278 320,260" fill="#0ea5e9" opacity=".4"/>
    <polygon points="320,230 285,248 285,278 320,260" fill="none" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="305,245 270,263 270,293 305,275" fill="#0ea5e9" opacity=".3"/>
    <polygon points="305,245 270,263 270,293 305,275" fill="none" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- ====== FLOATING CARD: Cement Bag ====== -->
  <g class="f1" filter="url(#ds2)">
    <rect x="540" y="100" width="120" height="150" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Inner card -->
    <rect x="555" y="115" width="90" height="75" rx="10" fill="url(#g3)"/>
    <!-- Cement icon -->
    <rect x="578" y="128" width="44" height="50" rx="4" fill="#92400e" opacity=".9"/>
    <rect x="583" y="133" width="34" height="14" rx="2" fill="#fef3c7"/>
    <text x="600" y="144" font-family="Segoe UI,sans-serif" font-size="8" font-weight="800" fill="#92400e" text-anchor="middle">SEMEN</text>
    <text x="600" y="169" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">50 KG</text>
    <!-- Price -->
    <text x="600" y="212" font-family="Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle">Rp 52.000</text>
    <text x="600" y="230" font-family="Segoe UI,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">per sak</text>
  </g>

  <!-- ====== FLOATING CARD: Paint ====== -->
  <g class="f2" filter="url(#ds2)">
    <rect x="580" y="280" width="110" height="130" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Paint bucket icon -->
    <g transform="translate(610,298)">
      <rect x="0" y="8" width="50" height="42" rx="6" fill="url(#g2)"/>
      <rect x="5" y="0" width="40" height="12" rx="4" fill="#c2410c"/>
      <path d="M12,18 C12,18 25,10 38,18" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
      <circle cx="25" cy="30" r="8" fill="#fff" opacity=".2"/>
    </g>
    <!-- Label -->
    <text x="635" y="370" font-family="Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#f8fafc" text-anchor="middle">Cat Premium</text>
    <text x="635" y="388" font-family="Segoe UI,sans-serif" font-size="11" font-weight="800" fill="#f97316" text-anchor="middle">Rp 85.000</text>
  </g>

  <!-- ====== FLOATING BADGE: Promo ====== -->
  <g class="f3" filter="url(#ds2)">
    <circle cx="710" cy="80" r="38" fill="url(#g2)"/>
    <circle cx="710" cy="80" r="38" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="710" y="74" font-family="Segoe UI,sans-serif" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">PROMO</text>
    <text x="710" y="90" font-family="Segoe UI,sans-serif" font-size="14" font-weight="900" fill="#fef3c7" text-anchor="middle">20%</text>
  </g>

  <!-- ====== FLOATING STATS BADGE ====== -->
  <g class="f2" filter="url(#ds2)">
    <rect x="60" y="340" width="130" height="65" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Icon circle -->
    <circle cx="95" cy="372" r="16" fill="url(#g6)"/>
    <text x="95" y="377" font-family="Segoe UI,sans-serif" font-size="14" fill="#fff" text-anchor="middle">✓</text>
    <!-- Text -->
    <text x="148" y="367" font-family="Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#f8fafc" text-anchor="middle">1000+</text>
    <text x="148" y="384" font-family="Segoe UI,sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Produk Tersedia</text>
  </g>

  <!-- ====== DELIVERY TRUCK ICON ====== -->
  <g class="f1" filter="url(#ds2)">
    <rect x="50" y="140" width="120" height="75" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Truck mini icon -->
    <g transform="translate(68,152)">
      <rect x="0" y="14" width="48" height="28" rx="4" fill="url(#g2)"/>
      <rect x="48" y="20" width="22" height="22" rx="3" fill="#c2410c"/>
      <rect x="51" y="23" width="15" height="11" rx="2" fill="#7dd3fc" opacity=".6"/>
      <circle cx="18" cy="46" r="7" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <circle cx="58" cy="46" r="7" fill="#0f172a" stroke="#475569" stroke-width="2"/>
    </g>
    <!-- Label -->
    <text x="110" y="200" font-family="Segoe UI,sans-serif" font-size="9" font-weight="700" fill="#94a3b8" text-anchor="middle">Gratis Antar</text>
  </g>

  <!-- ====== FLOATING TOOLS ====== -->
  <g class="f3" filter="url(#ds2)">
    <rect x="700" y="200" width="70" height="70" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <!-- Wrench icon -->
    <g transform="translate(717,215)">
      <rect x="10" y="0" width="16" height="38" rx="3" fill="#94a3b8" transform="rotate(25,18,19)"/>
      <circle cx="18" cy="8" r="8" fill="none" stroke="#94a3b8" stroke-width="3"/>
      <circle cx="18" cy="8" r="3" fill="#1e293b"/>
    </g>
  </g>

  <!-- ====== BOTTOM ACCENT LINE ====== -->
  <rect x="0" y="500" width="800" height="20" fill="url(#g2)" opacity=".8"/>

  <!-- ====== PARTICLES / DOTS ====== -->
  <g class="pl">
    <circle cx="480" cy="50" r="3" fill="#fbbf24" opacity=".5"/>
    <circle cx="520" cy="90" r="2" fill="#e8590c" opacity=".4"/>
    <circle cx="150" cy="450" r="2.5" fill="#22d3ee" opacity=".3"/>
    <circle cx="750" cy="350" r="2" fill="#a78bfa" opacity=".4"/>
    <circle cx="300" cy="30" r="2" fill="#34d399" opacity=".3"/>
    <circle cx="680" cy="460" r="3" fill="#fbbf24" opacity=".3"/>
    <circle cx="50" cy="60" r="2" fill="#f97316" opacity=".4"/>
    <circle cx="420" cy="480" r="2.5" fill="#e8590c" opacity=".3"/>
  </g>

  <!-- Connecting lines (subtle) -->
  <g stroke="#334155" stroke-width=".5" stroke-dasharray="4 6" opacity=".3">
    <line x1="530" y1="175" x2="540" y2="160"/>
    <line x1="575" y1="350" x2="540" y2="380"/>
    <line x1="190" y1="340" x2="200" y2="310"/>
    <line x1="170" y1="175" x2="175" y2="190"/>
  </g>
</svg>