<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3D3E"/>
      <stop offset="1" stop-color="#134E4A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- totem / papan name post -->
  <rect x="24" y="18" width="16" height="30" rx="4" fill="#0D9488"/>

  <!-- glowing sign board -->
  <rect x="13" y="12" width="38" height="14" rx="4" fill="url(#panel)"/>

  <!-- neon light strip -->
  <rect x="16" y="15" width="32" height="3.5" rx="1.75" fill="#FFFFFF" opacity="0.95"/>

  <!-- subtle glow -->
  <rect x="13" y="12" width="38" height="14" rx="4" fill="none" stroke="#7DF9E0" stroke-width="1.5" opacity="0.6"/>
</svg>
