<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- Hanging sign / pylon -->
  <rect x="17" y="2" width="6" height="4" rx="1" fill="#D6E0ED"/>
  <rect x="10" y="6" width="20" height="2" rx="1" fill="url(#blue)"/>
  <line x1="12" y1="8" x2="10" y2="14" stroke="url(#blue)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="8" x2="30" y2="14" stroke="url(#blue)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Sign board -->
  <rect x="6" y="14" width="28" height="20" rx="4" fill="url(#blue)"/>
  <!-- Text lines -->
  <rect x="11" y="20" width="18" height="2" rx="1" fill="#FFFFFF" opacity="0.9"/>
  <rect x="14" y="24" width="12" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.6"/>
  <rect x="13" y="27" width="14" height="1.5" rx="0.75" fill="#FFFFFF" opacity="0.4"/>
</svg>
