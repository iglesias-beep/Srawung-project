<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2b3a"/>
      <stop offset="100%" stop-color="#2a3f55"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfc59b"/>
      <stop offset="50%" stop-color="#b08d57"/>
      <stop offset="100%" stop-color="#d4a94e"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="40%" stop-color="#d4a94e"/>
      <stop offset="100%" stop-color="#9a7a3c"/>
    </linearGradient>
    <linearGradient id="signFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2636"/>
      <stop offset="100%" stop-color="#243648"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow2">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#navy)" stroke="#b08d57" stroke-width="2"/>

  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#b08d57" stroke-width="0.5" opacity="0.4"/>

  <!-- Sign post -->
  <rect x="56" y="68" width="8" height="28" rx="2" fill="url(#goldShine)"/>
  <rect x="56" y="68" width="8" height="28" rx="2" fill="none" stroke="#9a7a3c" stroke-width="0.5"/>

  <!-- Post base -->
  <ellipse cx="60" cy="96" rx="14" ry="3" fill="#1a2636" opacity="0.5"/>
  <rect x="50" y="88" width="20" height="5" rx="2" fill="url(#gold)" opacity="0.8"/>

  <!-- Main sign board -->
  <g filter="url(#shadow2)">
    <rect x="24" y="22" width="72" height="48" rx="5" fill="url(#goldShine)"/>
    <rect x="24" y="22" width="72" height="48" rx="5" fill="none" stroke="#9a7a3c" stroke-width="1"/>

    <!-- Inner sign face -->
    <rect x="29" y="27" width="62" height="38" rx="3" fill="url(#signFace)"/>

    <!-- Text lines on sign (abstract representation) -->
    <rect x="36" y="34" width="30" height="3" rx="1.5" fill="#b08d57" opacity="0.9"/>
    <rect x="36" y="41" width="48" height="2" rx="1" fill="#d4a94e" opacity="0.5"/>
    <rect x="36" y="47" width="42" height="2" rx="1" fill="#d4a94e" opacity="0.4"/>
    <rect x="36" y="53" width="20" height="2" rx="1" fill="#d4a94e" opacity="0.3"/>

    <!-- Small decorative dots (representing lights/LEDs) -->
    <circle cx="82" cy="34" r="2" fill="#b08d57" opacity="0.8"/>
    <circle cx="82" cy="42" r="2" fill="#d4a94e" opacity="0.6"/>
    <circle cx="82" cy="50" r="2" fill="#b08d57" opacity="0.8"/>
  </g>

  <!-- Decorative corner accents -->
  <path d="M12,60 Q14,50 20,44" fill="none" stroke="#b08d57" stroke-width="0.8" opacity="0.3"/>
  <path d="M108,60 Q106,50 100,44" fill="none" stroke="#b08d57" stroke-width="0.8" opacity="0.3"/>
</svg>
